# Supabase project configuration
# Run `supabase link --project-ref vfskqzgphrunjxquqpks` to link this config to your project.

[project]
id = "vfskqzgphrunjxquqpks"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Raised from 1000 to 5000 on 2026-08-31: this is the REAL cap behind the
# Omnichannel Inbox's "1000" ceiling, not the query's own .limit(). PostgREST
# enforces this project-wide server-side setting on every response regardless
# of what a client's own .limit() asks for - confirmed live: a direct request
# with .limit(5000) against inbox_conversation_list (2,314 real rows) still
# came back truncated at exactly 1000 (HTTP 206, Content-Range 0-999/2314)
# until this was raised. See supabase/migrations/20260831040000_conversation_list_view.sql.
max_rows = 5000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[ingest]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Explicit rather than left to the CLI's own default, which pushed
# `true` here on 2026-09-04 and failed the whole config push with a 402
# (this project is on the free tier - vector buckets need a paid plan,
# and nothing in this CRM uses them). Matches the project's real state.
[storage.vector]
enabled = false

[auth]
enabled = true
# URL of the site that users are redirected to after login. Was still the
# local-dev default (127.0.0.1:3000) - never updated for production, which
# is why a real password reset link redirected Farwa (and every other real
# user, before her) to a local address instead of the live CRM. Found live,
# 2026-09-04, from her own screenshot of the broken redirect.
site_url = "https://crm.badartrader.com"
additional_redirect_urls = ["https://crm.badartrader.com", "http://127.0.0.1:3000", "https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions]
# Edge functions are located in supabase/functions/<function-name>/index.ts
# Deploy with: supabase functions deploy <function-name>
